<div class="register-container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Crea un account 🎫</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline">
          <mat-label>Username</mat-label>
          <input matInput formControlName="username">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input matInput formControlName="email" type="email">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Password</mat-label>
          <input matInput formControlName="password" type="password">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Tipo Account</mat-label>
          <mat-select formControlName="role">
            <mat-option value="user">Utente (Partecipante)</mat-option>
            <mat-option value="organizer">Organizzatore</mat-option>
          </mat-select>
        </mat-form-field>

        <p *ngIf="error" class="error">{{error}}</p>
        <button mat-raised-button color="primary" [disabled]="registerForm.invalid">Registrati</button>
      </form>
    </mat-card-content>
    <mat-card-footer style="padding: 20px; text-align: center;">
      <p>Hai già un account? <a routerLink="/login">Accedi qui</a></p>
    </mat-card-footer>
  </mat-card>
</div>
