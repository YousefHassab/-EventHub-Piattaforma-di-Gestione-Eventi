<div class="form-container">
  <h2>Crea Nuovo Evento 🏗️</h2>
  <form [formGroup]="eventForm" (ngSubmit)="onSubmit()">
    <mat-form-field appearance="fill">
      <mat-label>Titolo</mat-label>
      <input matInput formControlName="title">
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Data</mat-label>
      <input matInput [matDatepicker]="picker" formControlName="date">
      <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>

    <div class="row">
      <mat-form-field appearance="fill">
        <mat-label>Città</mat-label>
        <input matInput formControlName="city">
      </mat-form-field>
      <mat-form-field appearance="fill">
        <mat-label>Prezzo (€)</mat-label>
        <input matInput type="number" formControlName="price">
      </mat-form-field>
    </div>

    <mat-form-field appearance="fill">
      <mat-label>Categoria</mat-label>
      <input matInput formControlName="category" placeholder="Es: Concerto, Workshop...">
    </mat-form-field>

    <div class="file-upload">
      <label>Locandina dell'evento (File): </label>
      <input type="file" (change)="onFileSelected($event)" accept="image/*">
    </div>

    <button mat-raised-button color="primary" [disabled]="eventForm.invalid">Pubblica Evento</button>
  </form>
</div>
